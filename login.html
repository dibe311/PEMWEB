<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rekam Medis Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-teal-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-teal-700 mb-2">MedisDigital+</h1>
            <p class="text-gray-500">Silakan login untuk mengakses sistem</p>
        </div>
        <form action="index.html">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email / NIP</label>
                <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
            </div>
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center text-sm text-gray-600"><input type="checkbox" class="mr-2">Ingat saya</label>
                <a href="lupa-password.html" class="text-sm text-teal-600 hover:text-teal-800 font-medium">Lupa password?</a>
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-lg shadow-md transition">Masuk ke Sistem</button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-600">
            Belum punya akun? <a href="register.html" class="text-teal-600 hover:text-teal-800 font-medium">Daftar di sini</a>
        </div>
    </div>
</body>
</html>
