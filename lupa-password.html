<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-teal-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-teal-700">Reset Password</h1>
            <p class="text-gray-500 text-sm mt-2">Masukkan email Anda untuk menerima tautan reset password.</p>
        </div>
        <form action="login.html">
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Terdaftar</label>
                <input type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-lg shadow-md transition">Kirim Link Reset</button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-600">
            Ingat password Anda? <a href="login.html" class="text-teal-600 font-medium">Kembali ke Login</a>
        </div>
    </div>
</body>
</html>
